<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时盯盘仪表盘 实时盯盘仪表盘</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;color:#e6edf3;font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;font-size:13px;}
.header{padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #21262d;background:#161b22;}
.header h1{font-size:17px;font-weight:600;background:linear-gradient(90deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header .ts{font-size:12px;color:#8b949e;}
.filter-bar{padding:10px 24px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #21262d;background:#0d1117;}
.filter-bar label{font-size:12px;color:#8b949e;}
.filter-bar select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;min-width:120px;}
.filter-bar select:focus{outline:none;border-color:#58a6ff;}

/* KPI 卡片 */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 24px;}
.kpi-card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#58a6ff,#bc8cff);}
.kpi-card .label{font-size:11px;color:#8b949e;margin-bottom:4px;}
.kpi-card .value{font-size:22px;font-weight:700;color:#f0f6fc;}
.kpi-card .unit{font-size:11px;color:#8b949e;margin-left:2px;}
.kpi-card .chips{margin-top:6px;display:flex;gap:6px;}
.chip{font-size:10px;padding:1px 5px;border-radius:3px;}
.chip.up{color:#3fb950;background:#3fb95015;}
.chip.down{color:#f85149;background:#f8514915;}
.chip.neutral{color:#8b949e;background:#8b949e15;}

/* 图表区 */
.charts-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 24px 14px;}
.chart-panel{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;}
.chart-panel h3{font-size:12px;color:#8b949e;margin-bottom:10px;font-weight:500;}
.chart-box{width:100%;height:200px;}

/* 区县表格 */
.table-section{padding:0 24px 14px;}
.table-wrap{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;overflow-x:auto;}
.table-wrap h3{font-size:12px;color:#8b949e;margin-bottom:10px;font-weight:500;}
.dtable{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap;}
.dtable th{text-align:center;padding:6px 8px;color:#8b949e;border-bottom:1px solid #21262d;font-weight:500;position:sticky;top:0;background:#161b22;z-index:1;}
.dtable td{padding:5px 8px;border-bottom:1px solid #21262d;text-align:center;}
.dtable td:first-child{text-align:left;font-weight:500;color:#e6edf3;}
.dtable tr:hover{background:#1c2333;}
.dtable .bad{color:#f85149;font-weight:600;}
.dtable .good{color:#3fb950;}
.dtable .warn{color:#d29922;}
.dtable .summary-row{background:#1c2333;font-weight:600;}
.dtable .summary-row td{border-top:1px solid #30363d;}
.scroll-body{max-height:420px;overflow-y:auto;}

/* 运力线摘要 + 尾部 */
.bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 24px 20px;}
.bottom-panel{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;}
.bottom-panel h3{font-size:12px;color:#8b949e;margin-bottom:10px;font-weight:500;}
.line-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.line-card{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;text-align:center;}
.line-card .line-name{font-size:11px;color:#8b949e;margin-bottom:4px;}
.line-card .line-val{font-size:16px;font-weight:700;color:#f0f6fc;}
.line-card .line-sub{font-size:10px;color:#8b949e;margin-top:2px;}
.tail-table{width:100%;border-collapse:collapse;font-size:11px;}
.tail-table th{text-align:left;padding:5px 6px;color:#8b949e;border-bottom:1px solid #21262d;font-weight:500;}
.tail-table td{padding:4px 6px;border-bottom:1px solid #21262d;}
.tail-table .bad{color:#f85149;font-weight:600;}

/* 详情面板 */
.detail-panel{padding:0 24px 14px;display:none;}
.detail-panel.visible{display:block;}
.detail-wrap{background:#161b22;border:2px solid #58a6ff;border-radius:8px;padding:14px;}
.detail-wrap h3{font-size:13px;color:#58a6ff;margin-bottom:12px;font-weight:600;}
.detail-groups{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.detail-group{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;}
.detail-group h4{font-size:11px;color:#bc8cff;margin-bottom:8px;font-weight:500;}
.detail-item{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px solid #21262d;}
.detail-item:last-child{border-bottom:none;}
.detail-item .dlabel{font-size:10px;color:#8b949e;}
.detail-item .dval{font-size:12px;font-weight:600;color:#e6edf3;}
.detail-item .dval.bad{color:#f85149;}
.detail-item .dval.good{color:#3fb950;}
.detail-item .ddelta{font-size:9px;margin-left:4px;}
.detail-item .ddelta.up{color:#3fb950;}
.detail-item .ddelta.down{color:#f85149;}
</style>
</head>

<div class="header">
  <h1>实时盯盘仪表盘 · 实时盯盘仪表盘</h1>
  <span class="ts">2026-06-09 11:34 (Asia/Shanghai)</span>
</div>

<!-- 筛选栏 -->
<div class="filter-bar">
  <label>战区</label>
  <select id="sel-zone" onchange="onZoneChange()">
    <option value="">全部战区</option>
  </select>
  <label>区县</label>
  <select id="sel-city" onchange="onCityChange()">
    <option value="">全部区县</option>
  </select>
  <label>运力线</label>
  <select id="sel-line" onchange="render()">
    <option value="">全部（汇总）</option>
  </select>
</div>

<!-- 问题区县预警（可折叠） -->
<div class="table-section">
  <div class="table-wrap" style="border-color:#f85149;">
    <h3 style="color:#f85149;cursor:pointer;user-select:none;" onclick="toggleWarning()">
      <span id="warning-arrow">▶</span> ⚠ 问题区县预警 <span id="warning-summary" style="font-size:11px;font-weight:400;"></span>
    </h3>
    <div id="warning-content" style="display:none;">
      <!-- 全区县模式 -->
      <div id="warning-all">
        <div style="margin-bottom:10px;">
          <div style="font-size:11px;color:#f85149;margin-bottom:4px;" id="tt-below-count">妥投率低于98%的区县</div>
          <table class="tail-table" id="tbl-tt-below">
            <thead><tr><th>区县</th><th>推单</th><th>妥投率</th><th>日环比</th><th style="min-width:200px;">原因</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <table class="tail-table" id="tbl-t-longest">
            <thead><tr><th>区县</th><th>推单</th><th>T时长</th><th>原因</th></tr></thead>
            <tbody></tbody>
          </table>
          <table class="tail-table" id="tbl-cq-delta">
            <thead><tr><th>区县</th><th>出勤</th><th>日环比</th><th>原因</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <!-- 单区县模式 -->
      <div id="warning-city" style="display:none;">
        <div style="margin-bottom:10px;">
          <div style="font-size:11px;color:#f85149;margin-bottom:4px;" id="city-warning-title">运力线数据概览</div>
          <table class="tail-table" id="tbl-city-lines">
            <thead><tr><th>运力线</th><th>推单</th><th>妥投率</th><th>日环比</th><th>T时长</th><th>取消率</th><th>应开工</th><th>开工率</th><th>出勤</th><th>日环比</th><th>空闲率</th><th>负载(单/人)</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="city-line-issues"></div>
      </div>
    </div>
  </div>
</div>

<!-- KPI 卡片 -->
<div class="kpi-grid" id="kpi-grid"></div>

<!-- 图表区 -->
<div class="charts-row">
  <div class="chart-panel">
    <h3>运力线开工/出勤对比</h3>
    <div class="chart-box" id="chart-lines"></div>
  </div>
  <div class="chart-panel">
    <h3 id="top15-title">区县推单量 Top15</h3>
    <div class="chart-box" id="chart-top15"></div>
  </div>
  <div class="chart-panel">
    <h3>运力线妥投率分布</h3>
    <div class="chart-box" id="chart-tt"></div>
  </div>
</div>

<!-- 区县数据表格 -->
<div class="table-section">
  <div class="table-wrap">
    <h3>区县数据明细 <span id="table-count" style="color:#58a6ff;font-weight:400;"></span></h3>
    <div class="scroll-body">
      <table class="dtable" id="district-table">
        <thead>
          <tr>
            <th>区县</th>
            <th>推单量</th><th>日</th><th>周</th>
            <th>妥投率</th><th>日</th><th>周</th>
            <th>T准时率</th><th>日</th><th>周</th>
            <th>出勤</th><th>日</th><th>周</th>
            <th>开工率</th><th>日</th><th>周</th>
            <th>应开工</th><th>日</th><th>周</th>
            <th>开工</th><th>日</th><th>周</th>
            <th>T时长</th>
          </tr>
        </thead>
        <tbody id="district-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 详情面板 -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-wrap">
    <h3 id="detail-title">区县详情</h3>
    <!-- 多运力线对比表格（区县+未选运力线时显示） -->
    <div id="detail-compare" style="display:none;">
      <div style="overflow-x:auto;">
        <table class="dtable" id="compare-table" style="font-size:11px;">
          <thead id="compare-thead"></thead>
          <tbody id="compare-tbody"></tbody>
        </table>
      </div>
    </div>
    <!-- 单运力线详情（区县+运力线时显示） -->
    <div id="detail-single" style="display:none;">
      <div class="detail-groups">
        <div class="detail-group" id="dg-order">
          <h4>推单 &amp; 履约</h4>
          <div class="detail-items"></div>
        </div>
        <div class="detail-group" id="dg-except">
          <h4>异常 &amp; 客诉</h4>
          <div class="detail-items"></div>
        </div>
        <div class="detail-group" id="dg-capacity">
          <h4>运力详情</h4>
          <div class="detail-items"></div>
        </div>
        <div class="detail-group" id="dg-delivery">
          <h4>配送指标</h4>
          <div class="detail-items"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 运力线摘要 -->
<div class="table-section">
  <div class="table-wrap">
    <h3>运力线摘要</h3>
    <div class="line-summary" id="line-summary"></div>
  </div>
</div>

// 区县列表：合并所有运力线的区县
const allCities = new Set();
RAW.forEach(r=>allCities.add(r[0]));

const CITY_ORDER = ['镜湖','鸠江','弋江','凤阳','洪泽','天长','盱眙','定远','来安','明光','长丰','平城','云冈','云州','嘉鱼','通城','通山','咸安','兴平','杨陵','周至','铜梁','卡若'];
function cityOrderIdx(name){for(let i=0;i<CITY_ORDER.length;i++){if(name.startsWith(CITY_ORDER[i]))return i;}return 999;}
const orderedCities = Array.from(allCities).sort((a,b)=>cityOrderIdx(a)-cityOrderIdx(b));

// 战区数据（从配置注入，或使用内置默认值）
const ZONE_MAP = {"芜湖战区": ["镜湖", "鸠江", "弋江"], "苏皖北战区": ["凤阳", "洪泽", "天长", "盱眙"], "苏皖南战区": ["定远", "来安", "明光", "长丰"], "大同战区": ["平城", "云冈", "云州"], "湖北战区": ["嘉鱼", "通城", "通山", "咸安"], "陕西战区": ["兴平", "杨陵", "周至"], "川渝藏战区": ["铜梁", "卡若"]};
// 初始化战区下拉
Object.keys(ZONE_MAP).forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent=z;selZone.appendChild(o);});
// 构建反向映射：区县名前缀 → 战区名
const cityToZone = {};
Object.entries(ZONE_MAP).forEach(([zone, cities])=>{
  cities.forEach(c=>{cityToZone[c]=zone;});
});
function findZone(cityName){
  for(const [prefix, zone] of Object.entries(cityToZone)){
    if(cityName.startsWith(prefix)) return zone;
  }
  return '';
}

// 填充区县下拉（根据战区筛选）
function populateCities(zoneFilter){
  selCity.innerHTML='<option value="">全部区县</option>';
  let cities = orderedCities;
  if(zoneFilter){
    const zonePrefixes = ZONE_MAP[zoneFilter] || [];
    cities = orderedCities.filter(c=>zonePrefixes.some(p=>c.startsWith(p)));
  }
  cities.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;selCity.appendChild(o);});
}
populateCities('');

function onZoneChange(){
  selCity.value='';
  populateCities(selZone.value);
  render();
}
function onCityChange(){
  const city = selCity.value;
  if(city) selZone.value = findZone(city);
  render();
}

// === 辅助函数 ===
function chipHtml(label, val) {
  const s = String(val);
  const cls = s.startsWith('+')?'up':s.startsWith('-')?'down':'neutral';
  const arrow = cls==='up'?'▲':cls==='down'?'▼':'';
  return `<span class="chip ${cls}">${label} ${arrow}${s}</span>`;
}
function pctNum(v){try{return parseFloat(String(v).replace('%',''));}catch(e){return 0;}}
function colorClass(val, thresholds) {
  // thresholds: [good_min, bad_max] — above good_min=good, below bad_max=bad
  const n = pctNum(val);
  if(n >= thresholds[0]) return 'good';
  if(n <= thresholds[1]) return 'bad';
  return 'warn';
}
function deltaColor(val, reverse) {
  const s = String(val);
  if(s.startsWith('+')) return reverse ? 'down' : 'up';
  if(s.startsWith('-')) return reverse ? 'up' : 'down';
  return '';
}

// === 渲染 ===
function render() {
  const line = selLine.value;
  const city = selCity.value;
  const zone = selZone.value;
  // 选择运力线时用 LINE_RAW，否则用 RAW
  let baseData = line ? (LINE_RAW[line] || []) : RAW;
  let subset = baseData;
  if(city){
    subset = subset.filter(r=>r[0]===city);
  } else if(zone){
    const zonePrefixes = ZONE_MAP[zone] || [];
    subset = subset.filter(r=>zonePrefixes.some(p=>r[0].startsWith(p)));
  }

  renderKPI(line, city, subset);
  renderTop15(city, subset);
  renderDistrictTable(subset);
  renderDetail(line, city);
  renderLineChart(line);
  renderTTChart();
  renderLineSummary();
  renderTailTables();
}

function renderLineSummary() {
  const el = document.getElementById('line-summary');
  const zone = selZone.value;

  if(!LINE_OVERALL.length){el.innerHTML='<div style="color:#8b949e;">无运力线数据</div>';return;}

  if(city || zone) {
    // 按战区/区县筛选：从 LINE_RAW 数据重新计算各运力线汇总
    const lines = LINE_NAMES;
    const zonePrefixes = zone ? (ZONE_MAP[zone] || []) : null;
    el.innerHTML = lines.map(ln => {
      const lineData = LINE_RAW[ln] || [];
      let filtered = lineData;
      if(city) filtered = lineData.filter(r=>r[0]===city);
      else if(zonePrefixes) filtered = lineData.filter(r=>zonePrefixes.some(p=>r[0].startsWith(p)));
      if(!filtered.length) return '';
      const totalPush = filtered.reduce((s,r)=>s+(typeof r[1]==='number'?r[1]:0),0);
      const totalTuotou = filtered.reduce((s,r)=>s+(typeof r[23]==='number'?r[23]:0),0);
      const avgTT = totalPush>0?(totalTuotou/totalPush*100).toFixed(2)+'%':'—';
      const totalCq = filtered.reduce((s,r)=>s+(typeof r[16]==='number'?r[16]:0),0);
      const totalKg = filtered.reduce((s,r)=>s+(typeof r[19]==='number'?r[19]:0),0);
      const ttCls = pctNum(avgTT)>=98?'good':pctNum(avgTT)>=95?'warn':'bad';
      return `<div class="line-card">
        <div class="line-name">${ln}</div>
        <div class="line-val">${totalPush}</div>
        <div class="line-sub">推单</div>
        <div class="line-sub ${ttCls}">妥投 ${avgTT}</div>
        <div class="line-sub">出勤 ${totalCq}</div>
        <div class="line-sub">开工 ${totalKg}</div>
      </div>`;
    }).filter(Boolean).join('');
  } else {
    el.innerHTML = LINE_OVERALL.map(lo=>{
      const ttCls = pctNum(lo.tt[0])>=98?'good':pctNum(lo.tt[0])>=95?'warn':'bad';
      return `<div class="line-card">
        <div class="line-name">${lo.name}</div>

        <div class="line-sub">开工 ${lo.kg[0]} ${lo.kg[1]}</div>

    }).join('');
  }
}

function renderDetail(line, city) {
  const panel = document.getElementById('detail-panel');
  const compareDiv = document.getElementById('detail-compare');
  const singleDiv = document.getElementById('detail-single');

  if(!city) { panel.classList.remove('visible'); compareDiv.style.display='none'; singleDiv.style.display='none'; return; }

  panel.classList.add('visible');

  if(!line) {
    // 只选区县，未选运力线 → 显示各运力线对比表格
    compareDiv.style.display='block';
    singleDiv.style.display='none';
    document.getElementById('detail-title').textContent = `${city} · 各运力线数据对比`;

    // 对比表格的关键指标
    const compareFields = [
      {label:'推单量', key:'推单量', fmt:v=>v},
      {label:'妥投率', key:'妥投率', fmt:v=>v},
      {label:'用户T准时率', key:'用户T准时率（通用）', fmt:v=>v},
      {label:'出勤', key:'出勤骑手数', fmt:v=>v},
      {label:'开工率', key:'当前排班开工率', fmt:v=>v},
      {label:'应开工', key:'当前排班应开工骑手数', fmt:v=>v},
      {label:'开工', key:'当前排班且开工骑手数', fmt:v=>v},
      {label:'人效', key:'人效', fmt:v=>typeof v==='number'?v.toFixed(2):v},
      {label:'平均用户实际T', key:'平均用户实际T时长', fmt:v=>typeof v==='number'?v.toFixed(2):v},
      {label:'异常取消率', key:'异常取消率', fmt:v=>v},
    ];

    // 收集该区县有哪些运力线
    const lines = LINE_NAMES.filter(ln => DETAIL[city+'_'+ln]);
    if(!lines.length) { compareDiv.style.display='none'; return; }

    // 表头
    let thead = '<tr><th>指标</th>';
    lines.forEach(ln=>{ thead += `<th style="cursor:pointer;color:#58a6ff;" onclick="selLine.value='${ln}';render()">${ln}</th>`; });
    thead += '</tr>';
    document.getElementById('compare-thead').innerHTML = thead;

    // 表体
    let tbody = '';
    compareFields.forEach(cf => {
      tbody += `<tr><td style="text-align:left;font-weight:500;">${cf.label}</td>`;
      lines.forEach(ln => {
        const d = DETAIL[city+'_'+ln];
        const raw = d ? d[cf.key] : undefined;
        const val = (raw !== undefined && raw !== null) ? cf.fmt(raw) : '—';
        // 日环比
        const dayDelta = d ? d[cf.key+'_日环比'] : undefined;
        let deltaHtml = '';
        if(dayDelta !== undefined && dayDelta !== null) {
          const s = String(dayDelta);
          const isT = cf.key.includes('T时长') || cf.key.includes('平均用户实际T时长');
          const cls = s.startsWith('+')?(isT?'down':'up'):s.startsWith('-')?(isT?'up':'down'):'';
          if(cls) { const arrow=cls==='up'?'▲':'▼'; deltaHtml=`<span class="ddelta ${cls}">${arrow}${s}</span>`; }
        }
        // 着色逻辑
        let valCls = '';
        const numVal = pctNum(val);
        if(cf.key.includes('率') && !cf.key.includes('取消率')) {
          if(numVal >= 98) valCls='good'; else if(numVal <= 90) valCls='bad'; else valCls='warn';
        }
        if(cf.key === '异常取消率') {
          const n = parseFloat(String(raw))||0;
          if(n <= 0.5) valCls='good'; else if(n >= 2) valCls='bad'; else valCls='warn';
        }
        if(cf.key === '当前排班开工率') {
          if(numVal >= 95) valCls='good'; else if(numVal <= 80) valCls='bad'; else valCls='warn';
        }
        tbody += `<td class="${valCls}">${val}${deltaHtml}</td>`;
      });
      tbody += '</tr>';
    });
    document.getElementById('compare-tbody').innerHTML = tbody;

  } else {
    // 选了区县+运力线 → 显示单运力线详情
    compareDiv.style.display='none';
    singleDiv.style.display='block';

    const key = city + '_' + line;
    const d = DETAIL[key];
    if(!d) { panel.classList.remove('visible'); return; }
    document.getElementById('detail-title').textContent = `${city} · ${line} 详细数据`;

    function dv(col) {
      const v = d[col];
      if(v === undefined || v === null) return '—';
      if(typeof v === 'string') return v;
      if(typeof v === 'number') {
        if(Number.isInteger(v)) return v;
        if(col.includes('率') || col.includes('占比')) {
          return v<=1?(v*100).toFixed(2)+'%':v.toFixed(2)+'%';
        }
        return v.toFixed(2);
      }
      return String(v);
    }
    function dd(col) {
      const base = d[col+'_日环比'];
      if(base === undefined || base === null) return '';
      const s = String(base);
      const isT = col.includes('T时长') || col.includes('平均用户实际T时长');
      const cls = s.startsWith('+')?(isT?'down':'up'):s.startsWith('-')?(isT?'up':'down'):'';
      if(!cls) return '';
      const arrow = cls==='up'?'▲':'▼';
      return `<span class="ddelta ${cls}">${arrow}${s}</span>`;
    }

    function renderGroup(groupId, fields) {
      const el = document.querySelector('#'+groupId+' .detail-items');
      el.innerHTML = fields.map(f => {
        const val = dv(f);
        const delta = dd(f);
        const numVal = pctNum(val);
        let cls = '';
        if(f.includes('率') && !f.includes('取消') && !f.includes('出餐')) {
          if(numVal >= 98) cls='good'; else if(numVal <= 90) cls='bad';
        }
        if(f.includes('超时') || f.includes('取消率') || f.includes('不满意') || f.includes('投诉') || f.includes('差评') || f.includes('违规') || f.includes('虚假')) {
          const n = parseFloat(String(d[f]))||0;
          if(n > 0) cls='bad'; else cls='good';
        }
        return `<div class="detail-item"><span class="dlabel">${f}</span><span class="dval ${cls}">${val}${delta}</span></div>`;
      }).join('');
    }

    renderGroup('dg-order', DETAIL_FIELDS.order);
    renderGroup('dg-except', DETAIL_FIELDS.except);
    renderGroup('dg-capacity', DETAIL_FIELDS.capacity);
    renderGroup('dg-delivery', DETAIL_FIELDS.delivery);
  }
}

  const line = selLine.value;
  const allDiv = document.getElementById('warning-all');
  const cityDiv = document.getElementById('warning-city');

  if(city) {
    // 选中区县：运力线数据概览 + 问题总结（过滤普众）
    allDiv.style.display = 'none';
    cityDiv.style.display = 'block';

    const focusLines = line ? [line] : LINE_NAMES;
    const rows = [];
    const issues = [];
    // 区县整体妥投率（取RAW或LINE_RAW汇总）
    let cityTT = 0;
    const cityRow = RAW.find(r => r[0] === city);
    if(cityRow) cityTT = pctNum(cityRow[4]);
    focusLines.forEach(ln => {
      const d = DETAIL[city+'_'+ln];
      if(!d) return;
      const pushNum = d['推单量'] || 0;
      const tt = d['妥投率'] || '—';
      const ttDelta = d['妥投率_日环比'] || '—';
      const avgT = d['平均用户实际T时长'] || d['平均预测T'] || d['平均骑手T'] || '—';
      const cancel = d['异常取消率'] || '—';
      const shouldKg = d['当前排班应开工骑手数'] || 0;
      const kgRate = d['当前排班开工率'] || '—';
      const cq = d['出勤骑手数'] || 0;
      const cqDelta = d['出勤骑手数_日环比'] || '—';
      const idle = d['开工空闲率'] || '—';
      const load = d['骑手负载'] || '—';
      rows.push([ln, pushNum, tt, ttDelta, avgT, cancel, shouldKg, kgRate, cq, cqDelta, idle, load, ln]);

      // 诊断问题：区县妥投率<98.5%时都要分析
      const probs = diagnoseLine(d, ln, cityTT);
      if(probs) issues.push({ln, probs});
    });

    document.getElementById('city-warning-title').textContent = `${city} 运力线数据概览 (${rows.length}条)`;
    document.querySelector('#tbl-city-lines tbody').innerHTML = rows.map(r => {
      const ttCls = pctNum(r[2]) < 98 ? 'bad' : (pctNum(r[2]) >= 99 ? 'good' : '');
      const kgCls = pctNum(r[7]) < 80 ? 'bad' : (pctNum(r[7]) >= 95 ? 'good' : '');
      const cancelCls = pctNum(r[5]) > 2 ? 'bad' : (pctNum(r[5]) <= 0.5 ? 'good' : '');
      const loadNum = parseFloat(r[11]) || 0;
      const loadCls = loadNum > 1.5 ? 'bad' : (loadNum > 1.2 ? 'warn' : '');
      const loadDisplay = loadNum > 0 ? loadNum.toFixed(2) : '—';
      const staffLabel = r[12] === '普众' ? '开工' : '出勤';
      return `<tr>
        <td>${r[0]}</td><td>${r[1]}</td>
        <td class="${ttCls}">${r[2]}</td><td class="${deltaColor(r[3])}">${r[3]}</td>
        <td>${typeof r[4]==='number'?r[4].toFixed(2):r[4]}</td>
        <td class="${cancelCls}">${r[5]}</td>
        <td>${r[6]}</td><td class="${kgCls}">${r[7]}</td>
        <td>${r[8]}</td><td class="${deltaColor(r[9])}">${r[9]}</td>
        <td>${r[10]}</td><td class="${loadCls}">${loadDisplay}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="12" style="color:#8b949e;">无数据</td></tr>';

    // 问题总结
    const issuesHtml = issues.length ? issues.map(i =>
      `<div style="margin:6px 0;padding:6px 8px;background:#161b22;border-left:3px solid #f85149;border-radius:4px;">
        <span style="color:#f85149;font-weight:600;">${i.ln}</span>：${i.probs}
      </div>`
    ).join('') : '<div style="color:#3fb950;padding:6px 0;">✓ 所有运力线无异常</div>';
    document.getElementById('city-line-issues').innerHTML = issuesHtml;

    // 摘要
    const ttBad = rows.filter(r => pctNum(r[2]) < 98).length;
    const kgBad = rows.filter(r => pctNum(r[7]) < 80).length;
    const parts = [];
    if(ttBad) parts.push(`妥投率<98%: ${ttBad}条`);
    if(kgBad) parts.push(`开工率<80%: ${kgBad}条`);
    if(issues.length) parts.push(`共${issues.length}条运力线有异常`);
    document.getElementById('warning-summary').textContent = parts.length ? '— ' + parts.join('，') : '— 无异常';

  } else {
    // 全区县：展示区县维度问题（选战区时只显示该战区下的区县）
    allDiv.style.display = 'block';
    cityDiv.style.display = 'none';

    const zone = selZone.value;
    const zonePrefixes = zone ? ZONE_MAP[zone] || [] : null;

    const ttBelow = (TAIL.tt_below_threshold || []).filter(r => !zonePrefixes || zonePrefixes.some(p => r[0].startsWith(p)));
    const tLong = (TAIL.t_longest || []).filter(r => !zonePrefixes || zonePrefixes.some(p => r[0].startsWith(p)));
    const cqDelta = (TAIL.cq_delta_tail || []).filter(r => !zonePrefixes || zonePrefixes.some(p => r[0].startsWith(p)));
    const countEl = document.getElementById('tt-below-count');
    const zoneLabel = zone ? ` (${zone})` : '';
    countEl.textContent = ttBelow.length > 0 ? `妥投率低于98%的区县${zoneLabel} (${ttBelow.length}个)` : `妥投率均≥98%，无预警`;
    const parts = [];
    if(ttBelow.length) parts.push(`妥投率<98%: ${ttBelow.length}个`);
    if(tLong.length) parts.push(`T时长最长${tLong.length}个`);
    if(cqDelta.length) parts.push(`出勤环比最低${cqDelta.length}个`);
    document.getElementById('warning-summary').textContent = parts.length ? '— ' + parts.join('，') : '— 无预警';
    document.querySelector('#tbl-tt-below tbody').innerHTML = ttBelow.map(r=>
      `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="bad">${r[2]}</td><td class="${deltaColor(r[3])}">${r[3]}</td><td style="font-size:10px;color:#d29922;">${r[4]||''}</td></tr>`
    ).join('') || '<tr><td colspan="5" style="color:#3fb950;">✓ 所有区县妥投率≥98%</td></tr>';

    document.querySelector('#tbl-t-longest tbody').innerHTML = tLong.length ? tLong.map(r=>
      `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="bad">${typeof r[2]==='number'?r[2].toFixed(2):r[2]}</td><td style="font-size:10px;color:#d29922;max-width:200px;">${r[3]||''}</td></tr>`
    ).join('') : '';

    document.querySelector('#tbl-cq-delta tbody').innerHTML = cqDelta.length ? cqDelta.map(r=>
      `<tr><td>${r[0]}</td><td>${r[2]}</td><td class="bad">${r[3]}%</td><td style="font-size:10px;color:#d29922;max-width:200px;">${r[4]||''}</td></tr>`
    ).join('') : '';
  }
}

function diagnoseLine(d, ln, cityTT) {
  const probs = [];
  const kg = pctNum(d['当前排班开工率']);
  const shouldKg = parseFloat(d['当前排班应开工骑手数']) || 0;
  const realKg = parseFloat(d['当前排班且开工骑手数']) || 0;
  const absent = shouldKg - realKg;
  const cq = parseFloat(d['出勤骑手数']) || 0;
  const cqDelta = d['出勤骑手数_日环比'] || '—';
  const load = parseFloat(d['骑手负载']) || 0;
  const idle = pctNum(d['开工空闲率']);
  const cancel = pctNum(d['异常取消率']);

  // 开工率（非普众）
  if(kg > 0) {
    probs.push(`开工率${kg.toFixed(0)}%（应开工${Math.round(shouldKg)}人，实际开工${Math.round(realKg)}人，缺勤${Math.round(absent)}人）`);
  }
  // 出勤
  probs.push(`出勤${Math.round(cq)}人${cqDelta !== '—' ? '（日' + cqDelta + '）' : ''}`);
  // 负载
  probs.push(`负载${load.toFixed(1)}单/人`);
  // 空闲率
  probs.push(`空闲${idle.toFixed(0)}%`);
  // 取消率
  if(cancel > 1) probs.push(`取消率${cancel.toFixed(1)}%`);

  return probs.join('；');
}

// 首次渲染
render();
</script>
